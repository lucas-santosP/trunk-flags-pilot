name: Rollback production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Digite ROLLBACK para confirmar o redeploy desta tag em produção
        type: string
        required: true

permissions:
  contents: write
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Somente tags vX.Y.Z e com confirmação
        if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'v') || inputs.confirm != 'ROLLBACK'
        run: |
          echo "::error::Escolha uma TAG vX.Y.Z em 'Use workflow from' e digite ROLLBACK. Recebido: ${{ github.ref }}"
          exit 1

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.CF_PAGES_PROJECT }}.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-deploy
        with:
          environment: production
          pages-branch: main
          version: ${{ github.ref_name }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          pages-project: ${{ vars.CF_PAGES_PROJECT }}

      - name: Marcar release como latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest
