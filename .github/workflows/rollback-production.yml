name: Rollback production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da versão a republicar em produção (ex. v1.4.2)
        type: string
        required: true
      confirm:
        description: Digite ROLLBACK para confirmar
        type: string
        required: true

permissions:
  contents: write
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      CONFIRM: ${{ inputs.confirm }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Rodar a partir da main, com tag vX.Y.Z existente e confirmação
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Rode o rollback a partir da main e informe a tag no campo 'tag'. Recebido: $GITHUB_REF"
            exit 1
          fi
          if [ "$CONFIRM" != "ROLLBACK" ]; then
            echo "::error::Digite ROLLBACK para confirmar."
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag inválida: '$TAG'. Use o formato vX.Y.Z."
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent; then
            echo "::error::A tag $TAG não existe."
            exit 1
          fi

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      issues: write
      pull-requests: write
    environment:
      name: production
      url: https://${{ vars.CF_PAGES_PROJECT }}.pages.dev
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Código da tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Ferramentas da main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: main-tools

      - uses: ./main-tools/.github/actions/build-deploy
        with:
          environment: production
          pages-branch: main
          version: ${{ inputs.tag }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          pages-project: ${{ vars.CF_PAGES_PROJECT }}

      - name: Marcar release como latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --prerelease=false --latest

      - name: Marcar nas PRs revertidas que saíram de produção
        working-directory: main-tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-notify.ts rollback "$TAG"
