name: Env sync (review relay)

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  actions: write

jobs:
  dispatch:
    if: vars.ENV_REQUIRE_APPROVED_REVIEW != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar env-sync na main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run env-sync.yml --ref main -R "$GITHUB_REPOSITORY"
