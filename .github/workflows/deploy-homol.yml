name: Deploy homol

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  deployments: write
  checks: read

jobs:
  homol:
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: homol
    secrets: inherit

  hotfix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      HOTFIX_ALLOWED_ROLES: ${{ vars.HOTFIX_ALLOWED_ROLES }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Dispensar homol para PRs com label hotfix
        run: bun scripts/hotfix-waiver.ts
