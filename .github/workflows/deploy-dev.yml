name: Deploy dev

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  deployments: write
  checks: read

jobs:
  dev:
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: dev
    secrets: inherit
