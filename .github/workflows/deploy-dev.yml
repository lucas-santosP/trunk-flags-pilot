name: Deploy dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev.${{ vars.CF_PAGES_PROJECT }}.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-deploy
        with:
          environment: dev
          pages-branch: dev
          version: dev-${{ github.sha }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          pages-project: ${{ vars.CF_PAGES_PROJECT }}
