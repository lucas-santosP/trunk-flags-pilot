name: Release production

on:
  push:
    branches: [main]

permissions:
  contents: write
  deployments: write
  pull-requests: read

concurrency:
  group: release-production
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Bump pelo label da PR (release:minor / release:major)
        id: bump
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)][0].labels // [] | map(.name) | join(",")')
          bump=patch
          case ",$labels," in
            *,release:major,*) bump=major ;;
            *,release:minor,*) bump=minor ;;
          esac
          echo "Labels: ${labels:-nenhum} -> bump $bump"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - id: version
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
        run: echo "version=$(bun scripts/next-version.ts "$BUMP")" >> "$GITHUB_OUTPUT"

      - name: Criar tag + GitHub Release (pre-release até o deploy)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            --prerelease

  deploy:
    needs: tag
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.CF_PAGES_PROJECT }}.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-deploy
        with:
          environment: production
          pages-branch: main
          version: ${{ needs.tag.outputs.version }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          pages-project: ${{ vars.CF_PAGES_PROJECT }}

      - name: Marcar release como latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: gh release edit "$VERSION" --prerelease=false --latest
