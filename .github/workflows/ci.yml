name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Flags (consistência + regras de PR)
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: bun run flags:check

      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

      - name: Build com flags de homol
        run: bun run build:homol

      - name: Build com flags de produção
        run: bun run build:production
