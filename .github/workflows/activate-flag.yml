name: Activate flag in production

on:
  workflow_dispatch:
    inputs:
      flag:
        description: Nome da release flag a ativar em produção (ex. bannerBoasVindas)
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: activate-flag-${{ inputs.flag }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Somente a partir de main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Rode a partir de main (recebido: ${{ github.ref }})"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Abrir PR de ativação
        env:
          GH_TOKEN: ${{ github.token }}
          FLAG: ${{ inputs.flag }}
        run: |
          branch="flags/activate-$FLAG"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::error::Já existe a branch $branch (PR de ativação aberta?)"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"

          metadata=$(bun scripts/flags-activate.ts "$FLAG")
          description=$(echo "$metadata" | jq -r '.description')
          owner=$(echo "$metadata" | jq -r '.owner')

          origin_commit=$(git log --reverse --format=%H -S "\"$FLAG\"" -- flags/registry.json | head -1)
          origin_pr=""
          if [ -n "$origin_commit" ]; then
            origin_pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$origin_commit/pulls" --jq '.[0].number // empty')
          fi

          homol_sha=$(.github/scripts/last-successful-deploy.sh homol)
          homol_tag=""
          if [ -n "$homol_sha" ]; then
            homol_tag=$(git tag --points-at "$homol_sha" --list 'v*' | sort -V | tail -1)
          fi

          git add flags/production.json
          git commit --message "feat(flags): enable $FLAG in production"
          git push --set-upstream origin "$branch"

          {
            echo "## Ativação em produção: \`$FLAG\`"
            echo
            echo "> $description"
            echo
            echo "| | |"
            echo "|---|---|"
            if [ -n "$origin_pr" ]; then
              echo "| PR que criou a feature | #$origin_pr |"
            else
              echo "| PR que criou a feature | não encontrada (commit \`${origin_commit:-?}\`) |"
            fi
            echo "| Owner | @$owner |"
            echo "| Última versão em homol | ${homol_tag:-desconhecida} |"
            echo "| Solicitado por | @$GITHUB_ACTOR |"
            echo
            echo "Esta PR altera **somente** \`flags/production.json\`."
            echo
            echo "## Depois do merge"
            echo
            echo "O workflow **Fast-track production** detecta que a diferença para homol é só \`flags/production.json\`, cria a tag e dispara **Promote to production**. Basta aprovar o deploy de produção."
            echo
            echo "Se outras mudanças entrarem em \`main\` antes do merge, o fast-track não se aplica: siga o fluxo normal (Release homol → Promote to production)."
          } > pr-body.md

          gh pr create --base main --head "$branch" \
            --title "feat(flags): ativar $FLAG em produção" \
            --body-file pr-body.md
          gh pr edit "$branch" --add-reviewer "$owner" || echo "Não foi possível adicionar @$owner como reviewer."

          gh workflow run ci.yml --ref "$branch"
