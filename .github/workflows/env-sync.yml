name: Env sync

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, closed, labeled, unlabeled, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  deployments: write
  checks: read

jobs:
  dev:
    if: vars.ENV_DEV_ENABLED != 'false'
    uses: ./.github/workflows/env-deploy.yml
    with:
      environment: dev
    secrets: inherit

  homol:
    uses: ./.github/workflows/env-deploy.yml
    with:
      environment: homol
    secrets: inherit
