name: Env sync relay

on:
  pull_request_target:
    types: [opened, reopened, closed, labeled, unlabeled, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  actions: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar env-sync na main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run env-sync.yml --ref main -R "$GITHUB_REPOSITORY"
