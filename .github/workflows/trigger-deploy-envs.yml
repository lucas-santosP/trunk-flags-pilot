name: Trigger deploy envs

on:
  pull_request_target:
    types: [opened, reopened, closed, labeled, unlabeled, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  actions: write

jobs:
  trigger:
    if: github.event.action != 'closed' || github.event.pull_request.merged != true
    runs-on: ubuntu-latest
    steps:
      - name: Disparar os deploys de ambiente na main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in deploy-dev.yml deploy-homol.yml; do
            if gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/$workflow?ref=main" --silent 2>/dev/null; then
              gh workflow run "$workflow" --ref main -R "$GITHUB_REPOSITORY"
              echo "Disparado: $workflow"
            fi
          done
