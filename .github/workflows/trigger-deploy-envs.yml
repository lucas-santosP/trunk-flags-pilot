name: Trigger deploy envs

on:
  pull_request_target:
    types: [opened, reopened, closed, labeled, unlabeled, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Deploy dev & homol na main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-envs.yml --ref main -R "$GITHUB_REPOSITORY"
