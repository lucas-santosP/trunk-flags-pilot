name: Trigger deploy envs

on:
  pull_request_target:
    types: [opened, reopened, closed, labeled, unlabeled, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  trigger:
    if: github.event.action != 'closed' || github.event.pull_request.merged != true
    runs-on: ubuntu-latest
    steps:
      - name: Disparar os deploys de ambiente na main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in deploy-dev.yml deploy-homol.yml; do
            if gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/$workflow?ref=main" --silent 2>/dev/null; then
              gh workflow run "$workflow" --ref main -R "$GITHUB_REPOSITORY"
              echo "Disparado: $workflow"
            fi
          done

      - name: Checkout da main (scripts confiáveis, nunca o código da PR)
        if: (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name == 'hotfix'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        if: (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name == 'hotfix'
        uses: oven-sh/setup-bun@v2

      - name: Aplicar ou revogar a dispensa de homol (label hotfix)
        if: (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name == 'hotfix'
        env:
          GH_TOKEN: ${{ github.token }}
          HOTFIX_ALLOWED_ROLES: ${{ vars.HOTFIX_ALLOWED_ROLES }}
          LABEL_ACTION: ${{ github.event.action }}
          LABEL_ACTOR: ${{ github.event.sender.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/hotfix-waiver.ts
