name: Fast-track production

on:
  push:
    branches: [main]

permissions:
  contents: write
  deployments: read
  actions: write

concurrency:
  group: fast-track-prod
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diferença para homol é só flags/production.json?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          homol_sha=$(.github/scripts/last-successful-deploy.sh homol)
          if .github/scripts/is-production-flags-only.sh "$homol_sha" "$GITHUB_SHA"; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "Elegível: $GITHUB_SHA difere de homol ($homol_sha) só em flags/production.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Fast-track não se aplica (homol em ${homol_sha:-nenhum}). Siga o fluxo normal: Release homol → Promote to production." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.check.outputs.eligible == 'true'

      - name: Criar tag + Release e disparar Promote to production
        if: steps.check.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun install --frozen-lockfile
          version=$(bun scripts/next-version.ts patch)
          gh release create "$version" \
            --target "$GITHUB_SHA" \
            --title "$version" \
            --generate-notes \
            --prerelease
          gh workflow run promote-prod.yml --ref "$version"
          echo "Tag $version criada. Aprove o deploy em Actions → Promote to production." >> "$GITHUB_STEP_SUMMARY"
