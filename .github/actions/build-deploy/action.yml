name: Build and deploy to Cloudflare Pages
description: Builda o app para um ambiente e publica no alias correspondente do Cloudflare Pages

inputs:
  environment:
    description: dev | homol | production
    required: true
  pages-branch:
    description: Branch do Cloudflare Pages (main = produção, demais = alias)
    required: true
  version:
    description: Versão exibida no app (tag ou sha curto)
    required: true
  cloudflare-api-token:
    required: true
  cloudflare-account-id:
    required: true
  pages-project:
    required: true

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2

    - name: Install
      shell: bash
      run: bun install --frozen-lockfile

    - name: Commit buildado
      id: commit
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Build
      shell: bash
      env:
        APP_VERSION: ${{ inputs.version }}
        COMMIT_SHA: ${{ steps.commit.outputs.sha }}
      run: bun run build:${{ inputs.environment }}

    - name: Produção sem painel nem manifesto
      if: inputs.environment == 'production'
      shell: bash
      run: bun run check:production-bundle

    - uses: ./.github/actions/pages-deploy
      with:
        pages-branch: ${{ inputs.pages-branch }}
        commit-hash: ${{ steps.commit.outputs.sha }}
        commit-message: ${{ inputs.environment }} ${{ inputs.version }}
        cloudflare-api-token: ${{ inputs.cloudflare-api-token }}
        cloudflare-account-id: ${{ inputs.cloudflare-account-id }}
        pages-project: ${{ inputs.pages-project }}
